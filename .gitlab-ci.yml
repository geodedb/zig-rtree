---
# GitLab CI/CD Pipeline for rtree
# SPDX-License-Identifier: Apache-2.0

include:
  # Security scanning
  - component: gitlab.com/devnw/ci-catalog/security-sast@v1.7.1
  - component: gitlab.com/devnw/ci-catalog/security-dependency-scanning@v1.7.1
  - component: gitlab.com/devnw/ci-catalog/security-secrets@v1.7.1
  - component: gitlab.com/devnw/ci-catalog/security-gitleaks@v1.7.1

  # Code quality (allow_failure: component uses old Zig download URL format)
  - component: gitlab.com/devnw/ci-catalog/zig-format@v1.2.1

  # SBOM
  - component: gitlab.com/devnw/ci-catalog/sbom-generate@v1.7.1
  - component: gitlab.com/devnw/ci-catalog/sbom-scan@v1.7.1

  # Release
  - component: gitlab.com/devnw/ci-catalog/release-semantic@v1.7.1

variables:
  ZIG_VERSION: "0.15.2"
  ZIG_SHA256: "02aa270f183da276e5b5920b1dac44a63f1a49e55050ebde3aecc9eb82f93239"

stages:
  - lint
  - build
  - test
  - security
  - sbom
  - release

# Zig installation template
.install-zig: &install-zig
  - apt-get update && apt-get install -y curl xz-utils
  - curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz" -o zig.tar.xz
  - echo "${ZIG_SHA256}  zig.tar.xz" | sha256sum -c -
  - tar -xf zig.tar.xz
  - export PATH="$PWD/zig-x86_64-linux-${ZIG_VERSION}:$PATH"
  - zig version

# Build job
build:
  stage: build
  image: debian:bookworm-slim
  before_script:
    - *install-zig
  script:
    - zig build
  artifacts:
    paths:
      - zig-out/
    expire_in: 1 hour

# Unit tests
test:
  stage: test
  image: debian:bookworm-slim
  before_script:
    - *install-zig
  script:
    - zig build test --summary all
  needs:
    - build

# Integration tests
test-integration:
  stage: test
  image: debian:bookworm-slim
  before_script:
    - *install-zig
  script:
    - zig build test-integration --summary all
  needs:
    - build

# Release optimization tests
test-release-safe:
  stage: test
  image: debian:bookworm-slim
  before_script:
    - *install-zig
  script:
    - zig build test -Doptimize=ReleaseSafe --summary all
  needs:
    - build

# Integration tests at ReleaseSafe
test-integration-release-safe:
  stage: test
  image: debian:bookworm-slim
  before_script:
    - *install-zig
  script:
    - zig build test-integration -Doptimize=ReleaseSafe --summary all
  needs:
    - build

# Override zig-format component to allow failure (component uses old URL format)
zig-format:
  allow_failure: true

# Cross-compilation tests
test-cross-build:
  stage: test
  image: debian:bookworm-slim
  before_script:
    - *install-zig
  script:
    - zig build -Dtarget=x86_64-linux
    - zig build -Dtarget=aarch64-linux
    - zig build -Dtarget=x86_64-macos
    - zig build -Dtarget=aarch64-macos
  needs:
    - build
